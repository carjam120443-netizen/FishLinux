name: Build FishLinux ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out FishLinux
        uses: actions/checkout@v4

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub2-common \
            mtools \
            dosfstools

      - name: Bootstrap Ubuntu 26.04 LTS
        run: |
          set -euxo pipefail
          sudo rm -rf build/rootfs build/iso
          sudo mkdir -p build/rootfs build/iso

          sudo debootstrap \
            --arch=amd64 \
            --components=main,restricted,universe,multiverse \
            --include=systemd-sysv,linux-image-generic,initramfs-tools,casper \
            resolute build/rootfs http://archive.ubuntu.com/ubuntu/

      - name: Configure Ubuntu repositories and install FishLinux desktop
        run: |
          set -euxo pipefail
          sudo tee build/rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu resolute main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu resolute-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu resolute-security main restricted universe multiverse
          EOF

          sudo cp /etc/resolv.conf build/rootfs/etc/resolv.conf

          sudo mount --bind /dev build/rootfs/dev
          sudo mount --bind /dev/pts build/rootfs/dev/pts
          sudo mount -t proc /proc build/rootfs/proc
          sudo mount -t sysfs /sys build/rootfs/sys
          sudo mount -t tmpfs tmpfs build/rootfs/run

          sudo chroot build/rootfs /bin/bash -eux <<'CHROOT'
          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C

          apt-get update
          apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            thunar \
            openbox \
            lightdm \
            lightdm-gtk-greeter \
            dbus-x11 \
            network-manager \
            sudo \
            xorg \
            xserver-xorg-video-all \
            ubuntu-standard

          systemctl enable lightdm || true
          systemctl enable NetworkManager || true

          useradd -m -s /bin/bash fish || true
          usermod -aG sudo,adm,cdrom,dip,plugdev,lpadmin,sambashare fish
          echo 'fish:fish' | chpasswd
          printf '%s\n' 'fish ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/fish
          chmod 440 /etc/sudoers.d/fish

          mkdir -p /etc/lightdm/lightdm.conf.d
          cat > /etc/lightdm/lightdm.conf.d/50-fishlinux.conf <<'EOF'
          [Seat:*]
          autologin-user=fish
          autologin-user-timeout=0
          user-session=xfce
          greeter-session=lightdm-gtk-greeter
          EOF

          mkdir -p /usr/share/fishlinux/branding
          cat > /etc/fishlinux-release <<'EOF'
          NAME="FishLinux"
          ID=fishlinux
          ID_LIKE=ubuntu
          VERSION_ID="0.1.0"
          UBUNTU_CODENAME="resolute"
          PRETTY_NAME="FishLinux 0.1.0 - Ubuntu 26.04 LTS + XFCE + Openbox"
          EOF

          echo 'fishlinux' > /etc/hostname
          rm -f /etc/machine-id
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOT

          sudo cp branding/fishlinux-aero.svg build/rootfs/usr/share/fishlinux/branding/fishlinux-aero.svg

          sudo umount -lf build/rootfs/run || true
          sudo umount -lf build/rootfs/sys || true
          sudo umount -lf build/rootfs/proc || true
          sudo umount -lf build/rootfs/dev/pts || true
          sudo umount -lf build/rootfs/dev || true

      - name: Build SquashFS
        run: |
          set -euxo pipefail
          sudo mkdir -p build/iso/casper build/iso/.disk
          sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz -b 1M -noappend
          sudo cp build/rootfs/boot/vmlinuz-* build/iso/casper/vmlinuz
          sudo cp build/rootfs/boot/initrd.img-* build/iso/casper/initrd
          printf '%s\n' 'FishLinux 0.1.0' | sudo tee build/iso/.disk/info >/dev/null
          sudo du -sx --block-size=1 build/rootfs | cut -f1 | sudo tee build/iso/casper/filesystem.size >/dev/null

      - name: Create GRUB configuration
        run: |
          set -euxo pipefail
          sudo mkdir -p build/iso/boot/grub
          sudo tee build/iso/boot/grub/grub.cfg >/dev/null <<'EOF'
          set timeout=5
          set default=0

          menuentry 'FishLinux 0.1.0 - XFCE' {
              linux /casper/vmlinuz boot=casper quiet splash ---
              initrd /casper/initrd
          }

          menuentry 'FishLinux 0.1.0 - XFCE (safe graphics)' {
              linux /casper/vmlinuz boot=casper nomodeset ---
              initrd /casper/initrd
          }
          EOF

      - name: Build hybrid BIOS/UEFI ISO
        run: |
          set -euxo pipefail
          sudo grub-mkrescue -o build/FishLinux-0.1.0-amd64.iso build/iso
          ls -lh build/FishLinux-0.1.0-amd64.iso

      - name: Upload FishLinux ISO
        uses: actions/upload-artifact@v4
        with:
          name: FishLinux-0.1.0-amd64
          path: build/FishLinux-0.1.0-amd64.iso
          if-no-files-found: error
